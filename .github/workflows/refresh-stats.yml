name: Refresh site stats

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-site-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch GitHub repository stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run fetch:github

      - name: Fetch travel stats
        run: pnpm run fetch:travel

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): refresh site stats"
          branch: chore/refresh-site-stats
          delete-branch: true
          base: main
          title: "chore(deps): refresh site stats"
          body: |
            Auto-generated weekly refresh of:
            - GitHub repository statistics (stars, forks, description,
              language) and user stats (followers) from the GitHub API
            - Travel statistics (countries, cities, regions) from the
              Skratch share API

            Run `pnpm run fetch:github` and `pnpm run fetch:travel` locally
            to refresh manually.
          add-paths: |
            src/data/github-cache.json
            src/data/stats.json
            src/data/travel.json

      - name: Summarize
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          echo "PR opened: ${{ steps.cpr.outputs.pull-request-number }}"