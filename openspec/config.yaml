schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Personal site of Adam Setch (setchy.io). Astro 7 static site, pnpm-managed
  (Node 24), deployed to Netlify from main.

  Conventions:
  - Pages under src/pages/*.astro; content sections (blogs, radars) live in
    src/content/sections/*.md and render through [...slug].astro.
  - Data lives in typed modules under src/data/, regenerated by fetch scripts
    (scripts/fetch-github.mjs, scripts/fetch-travel.mjs). Data shapes are
    contract-gated by the typed-data spec — do not change JSON shapes without
    a typed-data delta.
  - Design system: CSS custom properties in src/styles/global.css (light +
    dark themes, indigo accent #4f46e5); self-hosted fonts (Newsreader, Inter,
    JetBrains Mono) via @fontsource latin subsets. Editorial + modern style.
  - Icons: Font Awesome SVG paths as CSS masks in src/styles/icons.css
    (generated — run `pnpm run generate:icons` after adding icons). NO icon
    fonts; masks render with currentColor.
  - Open Graph images are generated at build time by astro-og-canvas
    (src/pages/open-graph/[...route].ts; CanvasKit, bundled font assets;
    og:image derived from page path, no manual step).
  - Client interactivity lives in src/scripts/site.ts (theme, search,
    count-up animations, filters). Respect prefers-reduced-motion.
  - CI: "Refresh site stats" workflow weekly-refreshes github/travel data via
    auto-PR; repo is pnpm-only.
  - Style: clean, modern, restrained; no emoji in UI; semantic HTML; focus
    states and reduced-motion support expected.

